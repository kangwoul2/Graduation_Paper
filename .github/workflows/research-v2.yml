name: research-v2

on:
  push:
    branches: [main]
    paths:
      - 'research_v2/**'
      - '3.Labeled_data/BTC_ohlcv_data_Labeled.csv'
      - 'requirements-research-v2.txt'
      - '.github/workflows/research-v2.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-research-v2.txt

      - name: Install dependencies
        run: pip install -r requirements-research-v2.txt

      - name: Compile research code
        run: python -m py_compile research_v2/run_research.py

      - name: Run reproducible benchmark
        run: python research_v2/run_research.py

      - name: Upload research results
        uses: actions/upload-artifact@v4
        with:
          name: research-v2-results
          path: research_v2/results/
          if-no-files-found: error
          retention-days: 30
